name: Update CSDN Blogs

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: main-git-write
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # CSDN WAF 常拦截 GitHub Actions IP（HTTP 521）；脚本在 CI 下会保留现有 data/blogs.ts 并软退出
      - name: Fetch blog data from CSDN
        run: npm run fetch:blogs
        continue-on-error: true

      - name: Commit and push if changed
        id: push
        env:
          # 跳过 husky，避免 lint-staged 再次改格式制造差异
          HUSKY: "0"
        run: |
          set -eux

          echo "pushed=false" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/blogs.ts
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: 更新 CSDN 博客数据"

          push_with_rebase() {
            git fetch origin main

            # rebase 时：ours = origin/main，theirs = 本地抓取提交 → 冲突保留本地抓取结果
            if ! git rebase origin/main; then
              echo "Rebase conflict on blogs.ts — keeping freshly fetched data"
              git checkout --theirs -- data/blogs.ts
              npx prettier --write data/blogs.ts
              git add data/blogs.ts
              if ! GIT_EDITOR=true git rebase --continue; then
                git rebase --abort || true
                return 1
              fi
            fi

            git push origin HEAD:main
          }

          for attempt in 1 2 3 4 5; do
            echo "=== Push attempt ${attempt}/5 ==="
            if push_with_rebase; then
              echo "Pushed successfully on attempt ${attempt}"
              echo "pushed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Attempt ${attempt} failed; soft-reset to origin/main and retry"
            git rebase --abort 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main

            # fetch:blogs 内已包含 prettier --write data/blogs.ts
            npm run fetch:blogs
            git add data/blogs.ts
            if git diff --staged --quiet; then
              echo "No changes after refresh — blogs already up to date on main"
              exit 0
            fi
            git commit -m "chore: 更新 CSDN 博客数据"
            sleep $((attempt * 3))
          done

          echo "Failed to push after 5 attempts"
          exit 1

      - name: Trigger GitHub Pages deploy
        if: steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy to GitHub Pages" --ref main
