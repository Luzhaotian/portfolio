name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Update blog data
        run: npm run fetch:blogs
        continue-on-error: true

      - name: Build for GitHub Pages
        # next/font/google parses the live Google Fonts CSS at build time; from
        # Actions runner IPs Google sometimes returns src URLs with query
        # strings, which crashes the loader (null-pointer on the .woff2 regex).
        # Feed it committed CSS snapshots instead (font files still download
        # from gstatic). Regenerate after changing fonts: npm run gen:font-mocks
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          # Absolute path: the loader resolves this via require(), which is
          # relative to the webpack loader module, not the repo root.
          NEXT_FONT_GOOGLE_MOCKED_RESPONSES: ${{ github.workspace }}/font-mocks.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
